      - name: Find and extract source
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: هیچ فایل ZIP داخل Repository پیدا نشد"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f
